# ============================================================================
# Models available to the evaluation harness.
#
#   type: closed_source  -> reached over an HTTP API   (src/models/closed_source.py)
#   type: open_source    -> served locally by vLLM     (src/models/open_source.py)
#
# Credentials come from the environment, never from this file:
#   api_key: ${OPENAI_API_KEY}   is expanded at load time.
# `generate_with_functions` additionally uses API_KEYS / API_BASE_URL, which
# accept a comma-separated list of keys and rotate through them.
# ============================================================================

# Which model this run evaluates. Override on the command line with --model.
active_model: qwen3-8b

models:

  # ---------------------------------------------------------------- Anthropic
  claude-opus-5:
    type: closed_source
    model_name: claude-opus-5
    api_key: ${ANTHROPIC_API_KEY}
    endpoint: ${ANTHROPIC_ENDPOINT}      # an OpenAI-compatible /chat/completions URL
    max_tokens: 8000
    temperature: 0
    timeout: 120

  claude-sonnet-5:
    type: closed_source
    model_name: claude-sonnet-5
    api_key: ${ANTHROPIC_API_KEY}
    endpoint: ${ANTHROPIC_ENDPOINT}
    max_tokens: 8000
    temperature: 0
    timeout: 120

  # ------------------------------------------------------------------- OpenAI
  gpt-5.1:
    type: closed_source
    model_name: gpt-5.1
    api_key: ${OPENAI_API_KEY}
    endpoint: ${OPENAI_ENDPOINT}         # e.g. https://api.openai.com/v1/chat/completions
    max_tokens: 8000
    temperature: 0
    timeout: 120

  gpt-4.1:
    type: closed_source
    model_name: gpt-4.1                  # the model used in the paper
    api_key: ${OPENAI_API_KEY}
    endpoint: ${OPENAI_ENDPOINT}
    max_tokens: 2048
    temperature: 0
    timeout: 60

  # -------------------------------------------------- other OpenAI-compatible
  deepseek-chat:
    type: closed_source
    model_name: deepseek-chat
    api_key: ${DEEPSEEK_API_KEY}
    endpoint: ${DEEPSEEK_ENDPOINT}
    max_tokens: 2048
    temperature: 0
    timeout: 60

  grok-4:
    type: closed_source
    model_name: grok-4
    api_key: ${XAI_API_KEY}
    endpoint: ${XAI_ENDPOINT}
    max_tokens: 8000
    temperature: 0
    timeout: 120

  # ------------------------------------------------------- locally served
  # `model_path` must match the --served-model-name you gave vLLM.
  qwen3-8b:
    type: open_source
    model_path: qwen3-8b
    server_url: http://localhost:8001
    max_tokens: 2048
    temperature: 0
    timeout: 60

  qwen3-8b-sft:                          # your ToolForge-fine-tuned checkpoint
    type: open_source
    model_path: qwen3-8b-sft
    server_url: http://localhost:7999
    max_tokens: 2048
    temperature: 0
    timeout: 60

  qwen3-32b:
    type: open_source
    model_path: qwen3-32b
    server_url: http://localhost:8002
    max_tokens: 2048
    temperature: 0
    timeout: 60

  llama-8b:
    type: open_source
    model_path: meta-llama/Llama-3.1-8B-Instruct
    server_url: http://localhost:8001
    max_tokens: 2048
    temperature: 0
    timeout: 60
